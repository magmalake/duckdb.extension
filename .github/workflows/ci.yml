name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: the committed lock file is written by 0.78.0, and an
          # unpinned pixi rejects it as not up-to-date with the workspace.
          pixi-version: v0.78.0

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # The Mojo bridge is built from the working trees of the other magmalake
      # repos, which are not here. Check them out beside this one so the
      # include paths in mojo/pixi.toml resolve.
      - name: Check out the Mojo read stack
        run: |
          cd ..
          for repo in iceberg.mojo parquet.mojo arrow-mlake.mojo avro.mojo \
                      thrift.mojo zstd.mojo snappy.mojo lz4.mojo brotli.mojo \
                      hashes.mojo roaring.mojo objectstore.mojo threads.mojo; do
            git clone --quiet --depth 1 https://github.com/magmalake/$repo.git
          done

      - name: Build the bridge and the extension
        run: pixi run build

      - name: SQL tests against a PyIceberg fixture
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pixi run test
